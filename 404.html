<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – Shivi Games</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/favicon-192.png">
<link rel="icon" type="image/png" sizes="96x96" href="/assets/icons/favicon-96.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/icons/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#3D4CAE">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/site.css">
<style>
.lost{min-height:calc(100vh - 61px);display:grid;place-items:center;text-align:center}
.lost .big{font:700 clamp(96px,20vw,180px)/1 Fredoka,sans-serif;background:linear-gradient(90deg,#F5C66B,#FFE7A3,#F5C66B);-webkit-background-clip:text;background-clip:text;color:transparent}
.lost .dice{font-size:56px;display:inline-block;animation:roll 2.4s var(--ease,ease) infinite}
@keyframes roll{0%{transform:rotate(0)}40%{transform:rotate(360deg) translateY(-14px)}60%,100%{transform:rotate(360deg)}}
.lost p{font-size:19px;color:rgba(255,255,255,.88);max-width:460px;margin:14px auto 26px}
.lost .hero-actions{justify-content:center}
@media (prefers-reduced-motion:reduce){.lost .dice{animation:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="/" aria-label="Shivi Games home"><img class="logo-img" src="/assets/icons/logo-96.webp" alt="" width="34" height="34">Shivi Games</a>
  <nav aria-label="Main"><a href="/#games">Games</a><a href="/#contact">Contact</a></nav>
</div></header>
<main class="hero lost">
  <div class="hero-dots" aria-hidden="true"></div>
  <div class="wrap" style="display:block;padding:60px 16px">
    <div class="dice" aria-hidden="true">🎲</div>
    <div class="big">404</div>
    <h1 style="font-size:clamp(28px,4vw,40px);margin-top:6px">That move isn't on the board.</h1>
    <p>The page you're looking for has moved or never existed. Let's get you back in the game.</p>
    <div class="hero-actions">
      <a class="btn btn-gold" href="/">Back to home</a>
      <a class="btn btn-ghost" href="/boards/">Play Boards</a>
    </div>
  </div>
</main>
</body>
</html>
